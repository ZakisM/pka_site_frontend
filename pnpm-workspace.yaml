# Nothing published in the last three days gets installed, so a release pulled
# for being broken or malicious never lands here. Minutes.
minimumReleaseAge: 4320

# Vite+ ships its own build of Vite. These point every plugin that asks for
# `vite` at it; `vp migrate` moves the two versions together on an upgrade.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
