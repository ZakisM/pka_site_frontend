# Nothing published in the last seven days gets installed, so a release pulled
# for being broken or malicious never lands here. Minutes.
minimumReleaseAge: 10080

# Vite+ ships its own build of Vite. These point every plugin that asks for
# `vite` at it; `vp migrate` moves the two versions together on an upgrade.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
overrides:
  vite@*: "catalog:"

# Vite+ 1.8.0 was taken on 2026-11-27, three days after its release, so only
# these exact versions skip the seven days. Delete this list from 2026-12-01,
# when they're old enough anyway.
minimumReleaseAgeExclude:
  - vite-plus@1.8.0
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
