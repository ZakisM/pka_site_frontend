<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#0c0b0a" />

    <meta
      name="description"
      content="The Painkiller Already Index contains all of the events from the Painkiller Already Podcast. Episodes and events are automatically updated each week."
    />

    <base href="/" />

    <!-- The player and the thumbnails come from YouTube: open those
         connections while the app itself is still loading. -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />

    <!-- The square IX mark. PNG rather than SVG: the brand SVGs set their type
         in Raleway, and neither an <img> nor a tab favicon loads webfonts. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#0c0b0a" />

    <meta property="og:title" content="Painkiller Already Index" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/social.png" />
    <title>Painkiller Already Index</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
