name: Check

on:
  pull_request:
  push:
    branches: [master]

# A newer push to a pull request replaces the run already under way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, test, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes, so keep the token out of .git/config, where
          # dependency install scripts could read it.
          persist-credentials: false
      # Installs the Vite+ in the lockfile, the Node in .node-version and the
      # pnpm in package.json, then the dependencies.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
      - name: Format, lint and typecheck
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
      # The compiler has gone off silently before (see vite.config.ts). The
      # watch page's chunk is app code alone, so it only holds the compiler's
      # cache marker if the compiler ran.
      - name: Check the React Compiler ran
        run: grep -q 'react.memo_cache_sentinel' dist/assets/watch.*.js
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(vp exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's browser
        run: vp exec playwright install --with-deps chromium
      - name: Browser tests
        run: vp run test:e2e
      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The image is only published from master (deploy.yml), so build it here
  # too: a broken Dockerfile or nginx.conf fails the pull request instead.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes, so keep the token out of .git/config, where
          # dependency install scripts could read it.
          persist-credentials: false
      - name: Build the image
        run: docker build --tag pka-index-frontend .
      - name: Check nginx accepts its config
        run: docker run --rm pka-index-frontend nginx -t
      - name: Check the image doesn't run as root
        run: test "$(docker run --rm pka-index-frontend id -u)" != 0
      # A location that sets add_header of its own drops the server's, so the
      # security headers are checked on a response from each one: the app
      # shell, a route it falls back to, an asset, an icon and a missing asset.
      - name: Check every response carries the security headers
        run: |
          docker run --detach --name site --publish 5678:5678 pka-index-frontend
          trap 'docker rm --force site' EXIT
          # The container is up before nginx is: give it up to 20 seconds.
          if ! curl -fs --retry 20 --retry-delay 1 --retry-all-errors -o /dev/null localhost:5678/; then
            echo "::error::nginx didn't answer within 20 seconds"
            docker logs site
            exit 1
          fi
          asset=$(docker exec site sh -c 'ls /usr/share/nginx/html/assets/*.js | head -n 1 | xargs basename')
          for path in / /watch/1 "/assets/$asset" /favicon-32x32.png /assets/missing.js; do
            headers=$(curl -sI "localhost:5678$path")
            for name in Content-Security-Policy X-Content-Type-Options Referrer-Policy Permissions-Policy; do
              if ! grep -qi "^$name:" <<<"$headers"; then
                echo "::error::$path is served without $name"
                exit 1
              fi
            done
          done

  # Publishes the image, but only for master and only once everything above
  # has passed.
  deploy:
    name: Publish
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
