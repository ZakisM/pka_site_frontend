name: Build and Push images

on:
  push:
    paths-ignore:
      - "README.md"
    branches: [master]
  # rebuilt weekly even without a push, so fixes in nginx's image and Alpine
  # reach the published image; the server still has to pull it
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build and Push pka-index-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to DockerHub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: zakism/pka-index-frontend
          # :master however the build was started, so a scheduled one doesn't
          # also publish metadata-action's default :nightly
          tags: type=raw,value=master,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
