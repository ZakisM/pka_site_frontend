name: Build and Push images

on:
  # A push to master publishes from Check (check.yml), once its checks pass.
  workflow_call:
  # rebuilt weekly even without a push, so fixes in nginx's image and Alpine
  # reach the published image; the server still has to pull it
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build and Push pka-index-frontend
    # Only the default branch is published (as :master); a manual run from
    # another branch has nothing to push.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One publish at a time. Check cancels an older master run when a newer
    # push arrives, so pushes publish in order.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes, so keep the token out of .git/config, where
          # dependency install scripts could read it.
          persist-credentials: false
      - name: Log in to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: zakism/pka-index-frontend
          # :master however the build was started, so a scheduled one doesn't
          # also publish metadata-action's default :nightly
          tags: type=raw,value=master,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
