# Sent with every response, included in each `location` of nginx.conf: nginx
# drops the server's add_header lines in any location that sets one of its
# own, and every location here sets Cache-Control. `vp preview` sends the same
# headers (vite.config.ts reads this file), so the browser tests run under them.

# The app is its own origin's scripts, styles, fonts and API (the build inlines
# the smallest font subset into the CSS as a data: URL). YouTube adds the
# IFrame API's script (www.youtube.com, which loads more of itself, from there
# or s.ytimg.com), the player's iframe, and the thumbnails from i.ytimg.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self'; img-src 'self' https://i.ytimg.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;

# The browser's default, stated: YouTube refuses to play an embed whose page
# sends no referrer, and the origin is all it needs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here asks for these. Autoplay, fullscreen and the rest the player's
# iframe uses are left alone, so YouTube can still be granted them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
