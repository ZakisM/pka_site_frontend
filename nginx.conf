server {
    listen 5678;
    server_name front_end;

    root /usr/share/nginx/html;

    # The build writes .br (Brotli 11) and .gz beside every text file, so they
    # are served as they are; anything smaller is compressed on the fly.
    brotli on;
    brotli_static on;
    brotli_types text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    gzip on;
    gzip_proxied any;
    gzip_static on;
    gzip_types text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Built files carry a hash of their contents in their name, so a new build
    # is a new URL: browsers, and Cloudflare in front, can keep these for good.
    # A file that isn't there is a 404, never the app shell, so a tab still
    # running an old build fails cleanly and reloads (see main.tsx).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Icons and the social preview image keep their names between builds.
    location ~* \.(?:png|ico|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The app shell: kept, but checked on every load (a 304 with its ETag
    # costs nothing), so a deploy is picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    access_log off;
    error_log off;
}
